<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hello World</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: radial-gradient(circle at top left, #c7d2fe, transparent 40%), #f8fafc;
        color: #172033;
        font-family: system-ui, sans-serif;
        transition: background .3s, color .3s;
      }
      body.dark {
        background: radial-gradient(circle at top left, #312e81, transparent 40%), #111827;
        color: #f8fafc;
      }
      main {
        width: min(92vw, 620px);
        padding: 3.5rem 2rem;
        text-align: center;
        background: rgba(255,255,255,.75);
        border: 1px solid rgba(255,255,255,.8);
        border-radius: 28px;
        box-shadow: 0 24px 60px rgba(30, 41, 59, .18);
        backdrop-filter: blur(12px);
      }
      .dark main { background: rgba(31, 41, 55, .8); border-color: rgba(255,255,255,.1); }
      .badge { display: inline-block; padding: .35rem .75rem; border-radius: 999px; background: #e0e7ff; color: #3730a3; font-weight: 700; font-size: .85rem; }
      .dark .badge { background: #3730a3; color: #e0e7ff; }
      h1 { margin: 1rem 0 .5rem; font-size: clamp(2.8rem, 10vw, 5.2rem); letter-spacing: -.07em; }
      p { margin: 0 auto 2rem; max-width: 40ch; color: #556176; font-size: 1.1rem; line-height: 1.6; }
      .dark p { color: #cbd5e1; }
      .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: .8rem; }
      button { padding: .8rem 1.1rem; border: 0; border-radius: 12px; cursor: pointer; font: inherit; font-weight: 700; transition: transform .15s, box-shadow .15s; }
      button:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(79,70,229,.25); }
      #helloButton { background: #4f46e5; color: white; }
      #themeButton { background: #e5e7eb; color: #1f2937; }
      .dark #themeButton { background: #374151; color: #f8fafc; }
      #message { min-height: 1.5em; margin: 1.5rem 0 0; color: #4f46e5; font-weight: 700; }
      .dark #message { color: #a5b4fc; }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">A tiny interactive page</span>
      <h1>Hello, World!</h1>
      <p>Welcome! Press the button below for a cheerful greeting, or switch the mood.</p>
      <div class="actions">
        <button id="helloButton">Say hello</button>
        <button id="themeButton">Toggle theme</button>
      </div>
      <div id="message" aria-live="polite"></div>
    </main>
    <script>
      const greetings = ['Great to see you!', 'Hello there, explorer!', 'You make this page brighter!', 'Have a wonderful day!'];
      const message = document.querySelector('#message');
      document.querySelector('#helloButton').addEventListener('click', () => {
        message.textContent = greetings[Math.floor(Math.random() * greetings.length)];
      });
      document.querySelector('#themeButton').addEventListener('click', () => {
        document.body.classList.toggle('dark');
      });
    </script>
  </body>
</html>
